  <text x="42" y="688" fill="#94a3b8" font-family="monospace" font-size="10">{"{ node: \"risk_drawdown_q3\", weight: 0.35,"}</text>
  <text x="42" y="704" fill="#94a3b8" font-family="monospace" font-size="10">{"  recalc_Trigger: \"INSTANT\", tenant: \"WL_BANK\" }"}</text>

